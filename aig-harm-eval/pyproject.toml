[project]
name = "aig-harm-eval"
version = "0.1.0"
description = "Harm-eval extension for AI-Infra-Guard"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
    "datasketch>=1.6",
    "pyyaml>=6.0",
    "click>=8.1",
    "jinja2>=3.1",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
aig-eval = "aig_harm_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
